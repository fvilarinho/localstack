services:
  localstack:
    container_name: "localstack"
    image: "${LOCALSTACK_IMAGE}"
    ports:
      - "127.0.0.1:4566:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    environment:
      - LOCALSTACK_AUTH_TOKEN="${LOCALSTACK_AUTH_TOKEN}"
      - DEBUG=${DEBUG}
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"